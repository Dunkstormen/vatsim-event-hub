; Loaded via the PHPRC env var when starting `php artisan serve` (dev and
; staging). Laravel's ServeCommand spawns the actual request-handling
; `php -S` process as a child that does NOT inherit `-d` flags passed to the
; outer `artisan serve` invocation (see vendor ServeCommand::serverCommand()),
; and it strips almost all env vars from that child unless `--no-reload` is
; passed. So PHPRC only reaches the child, and uploads only see this ini,
; when both PHPRC is set AND --no-reload is passed to `artisan serve`.
upload_max_filesize = 10M
post_max_size = 12M
